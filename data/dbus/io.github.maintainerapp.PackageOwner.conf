<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus-busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.maintainerapp.PackageOwner"/>
  </policy>
  <!-- Delivery is open; every RPC resolves kernel credentials. Mutation also
       requires Polkit, and receipt/control access is bound to origin UID. -->
  <policy context="default">
    <allow send_destination="io.github.maintainerapp.PackageOwner"
           send_interface="io.github.maintainerapp.PackageOwner"/>
    <allow send_destination="io.github.maintainerapp.PackageOwner"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.maintainerapp.PackageOwner"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.maintainerapp.PackageOwner"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
