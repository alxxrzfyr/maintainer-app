<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus-busconfig.dtd">
<!--
  System bus policy for the Maintainer privileged helper.

  The system bus denies by default, so without this file every call from the
  unprivileged application is rejected with AccessDenied before the helper is
  activated. Polkit is then never consulted and no authentication dialog can
  appear, which presents an authorization prompt as a flat failure.

  Reaching the helper is intentionally open to any user. It is not the
  authorization boundary: each method validates its parameters and then calls
  Polkit, which decides whether the caller may proceed and prompts for a
  password when the action requires one. Restricting access here instead would
  deny the call before Polkit could ask, so the user would see a refusal with
  no way to authenticate.

  Only root may own the name, so no unprivileged process can impersonate the
  helper and answer on its behalf.
-->
<busconfig>
  <policy user="root">
    <allow own="io.github.maintainerapp.Helper"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.maintainerapp.Helper"
           send_interface="io.github.maintainerapp.Helper"/>

    <allow send_destination="io.github.maintainerapp.Helper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.maintainerapp.Helper"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.maintainerapp.Helper"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
