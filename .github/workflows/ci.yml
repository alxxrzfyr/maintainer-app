name: CI

on:
  push:
    branches: [main, "feat/**", "implementation/**", "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libsqlite3-dev libpolkit-gobject-1-dev pkg-config xvfb xauth dbus-x11 desktop-file-utils appstream fakeroot dpkg-dev python3-apt
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Strict full tests (three passes)
        run: |
          for pass in 1 2 3; do
            echo "Full native and Python test pass $pass/3"
            bash scripts/test-native.sh
            /usr/bin/python3 -W error::ResourceWarning -m unittest discover -s tests/performance -p 'test_*.py'
            /usr/bin/python3 -W error::ResourceWarning -m unittest discover -s tests/release -p 'test_*.py'
            /usr/bin/python3 -W error::ResourceWarning -m unittest discover -s tests/package_transaction -p 'test_*.py'
          done
      - run: python3 scripts/build-release.py
      - run: desktop-file-validate data/io.github.maintainerapp.Maintainer.desktop
      - run: appstreamcli validate --no-net data/io.github.maintainerapp.Maintainer.metainfo.xml
      - run: glib-compile-schemas --strict --dry-run data/

  package:
    name: package-${{ matrix.deb_arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            deb_arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libsqlite3-dev libpolkit-gobject-1-dev pkg-config dpkg-dev fakeroot
      - run: rustup show
      - run: python3 scripts/build-release.py
      - name: Package once for this architecture
        env:
          EXPECTED_DEB_ARCH: ${{ matrix.deb_arch }}
        run: bash scripts/build-package.sh "$RUNNER_TEMP/candidate"
      - name: Record candidate checksums
        run: |
          cd "$RUNNER_TEMP/candidate"
          sha256sum maintainer_*.deb > SHA256SUMS-${{ matrix.deb_arch }}
      - name: Bind source and immutable candidate
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          cp Cargo.lock "$RUNNER_TEMP/candidate/Cargo.lock"
          python3 scripts/validate-candidate.py manifest "$RUNNER_TEMP/candidate" "$DEB_ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintainer-deb-${{ matrix.deb_arch }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/candidate/maintainer_*.deb
            ${{ runner.temp }}/candidate/SHA256SUMS-${{ matrix.deb_arch }}
            ${{ runner.temp }}/candidate/SOURCE-${{ matrix.deb_arch }}.json
            ${{ runner.temp }}/candidate/Cargo.lock

  installed-artifact:
    name: installed-${{ matrix.deb_arch }}
    needs: package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            deb_arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maintainer-deb-${{ matrix.deb_arch }}
          path: ${{ runner.temp }}/candidate
      - name: Download mandatory previous release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          mkdir "$RUNNER_TEMP/previous"
          # Latest published release must predate this candidate. The installed
          # test rejects equal/newer versions and requires a real upgrade.
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "maintainer_*_${DEB_ARCH}.deb" --dir "$RUNNER_TEMP/previous"
          test "$(find "$RUNNER_TEMP/previous" -name '*.deb' | wc -l)" -eq 1
      - name: Install disposable runner test dependencies
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus-x11 policykit-1 xvfb xauth desktop-file-utils appstream python3 libgtk-4-1
          sudo systemctl start dbus polkit
      - name: Verify exact artifact install, upgrade, unprivileged readiness, remove and purge
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          (cd "$RUNNER_TEMP/candidate" && sha256sum --check "SHA256SUMS-${DEB_ARCH}")
          test "$(find "$RUNNER_TEMP/candidate" -name '*.deb' | wc -l)" -eq 1
          sudo env MAINTAINER_PACKAGE_TEST_DISPOSABLE=1 bash scripts/test-package.sh "$RUNNER_TEMP"/candidate/*.deb --previous-deb "$RUNNER_TEMP"/previous/*.deb
          (cd "$RUNNER_TEMP/candidate" && sha256sum --check "SHA256SUMS-${DEB_ARCH}")
      - name: Preserve installed-validated bytes and source manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintainer-validated-${{ matrix.deb_arch }}
          if-no-files-found: error
          path: ${{ runner.temp }}/candidate/*
