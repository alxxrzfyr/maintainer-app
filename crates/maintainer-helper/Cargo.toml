[package]
name = "maintainer-helper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "maintainer-helper"
path = "src/main.rs"

[dependencies]
maintainer-core = { path = "../maintainer-core" }
serde = { workspace = true }
thiserror = { workspace = true }
zbus = { workspace = true }
libc = "=0.2.172"
tokio = { version = "=1.45.1", features = ["rt", "time", "sync", "macros", "signal"] }

[dev-dependencies]
tokio = { version = "=1.45.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
